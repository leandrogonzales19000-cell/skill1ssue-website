<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill1ssue Prototype</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2230;--mut:#586274;--line:#d9dfe8;--blue:#1d4ed8;--soft:#e4ebff;--dark:#232323;--ok:#15803d;--okb:#dcfce7;--warn:#b45309;--warnb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;--fh:Poppins,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#eef1f6;--mut:#aab3c2;--line:#2e3644;--blue:#7da0ff;--soft:#1f2b4d;--okb:#12351f;--warnb:#3a2c0b;--badb:#3d1717;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:var(--fh);margin:0 0 .5em;line-height:1.2}h2{font-size:1.5rem}h3{font-size:1.02rem}p{margin:0 0 .8em}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:8px;z-index:50}
.sim{background:#232323;color:#e8ecf3;font-size:.82rem;padding:7px 14px;text-align:center}.sim b{color:#86efac}
.app{display:grid;grid-template-columns:1fr}
.top{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.logo{font:800 1.35rem var(--fh);color:var(--blue)}
.seg{display:flex;border:2px solid var(--blue);border-radius:10px;overflow:hidden}.seg span{font-size:.75rem;padding:8px 10px;color:var(--mut);align-self:center}
.seg button{border:0;background:none;color:var(--blue);font:600 .88rem inherit;padding:8px 14px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.lnk{background:none;border:0;color:var(--blue);font:600 .88rem inherit;cursor:pointer;text-decoration:underline}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:4px 0 max(4px,env(safe-area-inset-bottom))}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:500 .66rem inherit;background:none;border:0;color:var(--mut);padding:6px 2px;cursor:pointer}
#nav button[aria-current=page]{color:var(--blue);font-weight:700}
.nonav #nav{display:none}
main{padding:20px 16px 100px;max-width:1000px;width:100%;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media(min-width:900px){.app{grid-template-columns:210px 1fr}.top{grid-column:1/-1}.nonav{grid-template-columns:1fr}
 #nav{position:sticky;top:62px;height:calc(100vh - 62px);flex-direction:column;border:0;border-right:1px solid var(--line);padding:16px 10px;gap:4px;align-self:start}
 #nav button{flex:0;flex-direction:row;font-size:.95rem;padding:10px 12px;border-radius:10px;gap:10px}#nav button[aria-current=page]{background:var(--soft)}main{padding:28px 32px 60px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:16px}
.cols{display:grid;gap:16px;grid-template-columns:1fr;margin-top:16px}@media(min-width:900px){.cols{grid-template-columns:1.2fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;transition:box-shadow .2s,transform .2s}.grid .card:hover{box-shadow:0 8px 24px #0001;transform:translateY(-2px)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:.9rem}
.badge{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--blue)}
.badge.ok{background:var(--okb);color:var(--ok)}.badge.warn{background:var(--warnb);color:var(--warn)}.badge.bad{background:var(--badb);color:var(--bad)}.badge.gr{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}.chip{font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--mut)}
button.b{font:600 .88rem inherit;padding:8px 14px;border-radius:9px;border:2px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;transition:transform .15s}
button.b:hover{transform:translateY(-1px)}button.b.o{background:transparent;color:var(--blue)}button.b.d{background:transparent;color:var(--bad);border-color:var(--bad)}button.b:disabled{opacity:.5;cursor:default;transform:none}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}textarea{min-height:100px;resize:vertical}
input[type=checkbox]{width:auto}.chk{display:inline-flex;gap:6px;align-items:center;font-weight:400;margin:4px 12px 4px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}.stat b{display:block;font:700 1.8rem var(--fh);color:var(--blue);line-height:1.1}
.ring{width:120px;flex:none}.rb,.rf{fill:none;stroke-width:9}.rb{stroke:var(--line)}.rf{stroke:var(--blue);stroke-linecap:round;transition:stroke-dasharray .8s}.ring text{font:700 20px var(--fh);fill:var(--ink)}
.trk{display:flex;gap:4px;list-style:none;padding:0;margin:8px 0 12px}.trk li{flex:1;text-align:center;font-size:.72rem;padding:5px 2px;border-radius:6px;background:var(--bg);color:var(--mut)}.trk li.on{background:var(--soft);color:var(--blue);font-weight:700}.trk.g li.on{background:var(--okb);color:var(--ok)}
.lv{letter-spacing:2px;color:var(--blue)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.id{font-family:ui-monospace,Menlo,monospace;background:var(--soft);padding:2px 8px;border-radius:6px;font-size:.85rem}.cred{border-left:6px solid var(--ok)}
.empty{text-align:center;padding:30px 18px;color:var(--mut);border:2px dashed var(--line);border-radius:14px}
.box{background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.chk-l{list-style:none;padding:0;margin:0}.chk-l li{padding:6px 0;display:flex;gap:10px;align-items:center}.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;flex:none}.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}.done{color:var(--mut)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
dialog{border:0;border-radius:16px;padding:24px;width:min(540px,94vw);max-height:92vh;background:var(--card);color:var(--ink);box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0008}
.certf{border:3px double var(--blue);padding:22px;text-align:center;border-radius:6px}.certf h2{color:var(--blue)}.certf .nm{font:700 1.6rem var(--fh)}
#toast{position:fixed;bottom:84px;left:50%;transform:translate(-50%,120px);background:#232323;color:#fff;padding:11px 18px;border-radius:10px;transition:transform .3s;z-index:20;max-width:92vw;font-size:.92rem}#toast.on{transform:translate(-50%,0)}
#toast button{margin-left:10px;background:none;border:0;color:#86efac;font:700 .9rem inherit;cursor:pointer;text-decoration:underline}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px;align-items:center}.thumb{height:84px;border-radius:8px;border:1px solid var(--line);display:block}.fl a.chip{text-decoration:none;color:var(--blue)}
.mats{background:var(--soft);border-radius:10px;padding:12px 14px;margin:10px 0}.mats ul{margin:6px 0 0;padding-left:1.2em;word-break:break-all}.mimg{max-width:100%;border-radius:8px;border:1px solid var(--line);display:block;margin-top:8px}pre.code{max-height:220px;overflow:auto;background:var(--bg);padding:10px;border-radius:8px;font-size:.8rem;margin:8px 0;white-space:pre}.mats a.chip{text-decoration:none;color:var(--blue);display:inline-block}
.dmsg{margin:12px 0 0;font-weight:600;color:var(--bad);flex:1 0 100%}.sbar{position:sticky;bottom:-24px;background:var(--card);padding:12px 0 2px;margin-top:14px;border-top:1px solid var(--line)}.mats.err{outline:2px solid var(--bad)}.dmsg.okm{color:var(--ok)}
.foot{margin-top:40px;text-align:center;font-size:.82rem;color:var(--mut)}
body:has(dialog[open]) .app,body:has(dialog[open]) .sim{display:none}
@media print{.sim,.top,#nav,.noprint,.foot{display:none!important}.app{display:block}main{padding:0}dialog[open]{position:static;width:100%;max-width:none;box-shadow:none;max-height:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function readFile(f,mx=1280){return new Promise((ok,no)=>{
 if(/^image\//.test(f.type)){const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);ok({name:f.name.replace(/\.\w+$/,'')+'.jpg',type:'image/jpeg',w,h,data:c.toDataURL('image/jpeg',.82)})};im.onerror=()=>no('could not read this image');im.src=u}
 else if(f.size>1e6)no('is over 1 MB');else{const r=new FileReader();r.onload=()=>ok({name:f.name,type:f.type||'application/octet-stream',data:r.result});r.onerror=()=>no('could not be read');r.readAsDataURL(f)}})}
async function addFiles(inp){for(const f of [...inp.files]){if(PF.length>=3){toast('Maximum 3 files per submission.');break}try{PF.push(await readFile(f))}catch(x){toast(f.name+' '+x)}}inp.value='';$('#fl').innerHTML=flist()}

 review(id){const a=S.apps.find(x=>x.id===id),p=proj(a.pid);modal(`<form data-form="review" data-id="${id}"><h3>Review: ${esc(p.title)}</h3>${rounds(a)}${CRIT.map(([k,l])=>`<label for="r${k}">${l}</label><select id="r${k}" name="${k}">${[1,2,3,4].map(n=>`<option value="${n}" ${n===3?'selected':''}>${n}${n===1?' (poor)':n===4?' (excellent)':''}</option>`).join('')}</select>`).join('')}
  <label for="fb">Feedback (required to request a revision)</label><textarea id="fb" name="fb"></textarea><p class="mut">Passing needs an average of at least 2.5 and issues a verified credential.</p><div class="row"><button class="b" name="dec" value="pass">Pass and issue credential</button><button class="b o" name="dec" value="revise">Request revision</button><button type="button" class="b o" data-act="close">Cancel</button></div></form>`)},
 newp(){pform(blank)},editp(id){pform(proj(id),id)},dupp(id){const p=proj(id);pform({...p,title:p.title+' (copy)',skills:[...p.skills]})},
 closep(id){const p=proj(id);p.status=p.status==='open'?'closed':'open';save();render();toast(p.status==='open'?'Project reopened.':'Project closed. Students can no longer take it.')},
 delp(id){ask('Delete this project?','No students have taken it, so nothing else is affected.','Delete',()=>{snap=JSON.stringify(S);S.projects=S.projects.filter(p=>p.id!==id);save();render();undoable('Project deleted.')})},
 cert(id){const c=S.creds.find(x=>x.id===id);if(!c)return;modal(`<div class="certf"><p class="mut">Skill1ssue · Verified micro-project credential (prototype)</p><h2>Certificate of Completion</h2><p>This certifies that</p><p class="nm">${esc(c.holder)}</p><p>(${esc(c.prog)}) successfully completed</p><h3>${esc(c.title)}</h3><p class="mut">${esc(c.type)} · ${c.hrs} hours · for ${esc(c.firm)}${c.score?' · score '+c.score.toFixed(1)+'/4':''}<br>Issued ${fd(c.issuedAt)}</p><p>ID <span class="id">${c.id}</span></p></div><div class="row noprint" style="margin-top:14px"><button class="b" data-act="print">Print / save as PDF</button><button class="b o" data-act="link" data-id="${c.id}">Copy verify link</button><button class="b o" data-act="close">Close</button></div>`)},
 print(){window.print()},rmpm(id){PM.splice(+id,1);$('#pml').innerHTML=pmlist()},rmpd(id){PD.splice(+id,1);$('#pdl').innerHTML=pdlist()},pptx:()=>makePptx(),rmf(id){PF.splice(+id,1);$('#fl').innerHTML=flist()},close:closeM,ok(){closeM();pend&&pend();pend=null},clr(){Q={q:'',type:'',sort:'best'};render()},
 link(id){const u=location.href.split('#')[0]+'#verify='+id;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Verify link copied (works in the browser holding this demo data).'),()=>toast('Copy this ID: '+id))},
 exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='skill1ssue-demo-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Exported.')},
 reset(){ask('Reset demo data?','All projects, work and credentials return to the starting sample.','Reset',()=>{S=seed();save();go('student','dash');toast('Demo data reset.')})}
};
const F={
 profile(d){S.profile={...S.profile,name:d.name.trim(),prog:d.prog,year:d.year,skills:d.skills,saved:true};log('Profile updated');save();render();toast('Profile saved. Matching updated.')},
 submit(d,id){const a=S.apps.find(x=>x.id===id),prev=a.status;a.rounds.push({work:d.work.trim(),at:iso(),fb:'',files:PF});a.status='submitted';if(!save()){a.rounds.pop();a.status=prev;return toast('Not enough browser storage for these files. Remove one or use smaller files.')}log('Submitted version '+a.rounds.length+' of “'+proj(a.pid).title+'”');PF=[];save();closeM();render();toast('Submitted. Your files will appear in your portfolio.')},
 review(d,id,dec){const a=S.apps.find(x=>x.id===id),p=proj(a.pid),r=last(a),avg=(+d.acc+ +d.comp+ +d.comm)/3;
  if(dec==='revise'&&!d.fb.trim())return toast('Add feedback so the student knows what to revise.');
  if(dec==='pass'&&avg<2.5)return toast('Average score must be at least 2.5 to pass. Request a revision instead.');
  r.fb=d.fb.trim();r.rubric={acc:+d.acc,comp:+d.comp,comm:+d.comm};r.avg=avg;r.decidedAt=iso();
  if(dec==='pass'){a.status='passed';S.creds.push({id:'S1-'+uid().toUpperCase().slice(0,7),appId:a.id,title:p.title,firm:p.firm,type:p.type,hrs:p.hrs,skills:p.skills,score:avg,issuedAt:iso(),holder:S.profile.name,prog:S.profile.prog});log('“'+p.title+'” passed. Credential issued');toast('Passed. Credential issued to the student portfolio.')}
  else{a.status='revise';log('Revision requested on “'+p.title+'”');toast('Revision requested.')}
  save();closeM();render()},
 proj(d,id){const k=TH[d.type];
  if(k==='img'&&!PM.length)return mErr('CAD/SolidWorks projects need a photo of the dimensions. Add one above, or change the project type.');
  if(k==='xlsx'&&!PM.length)return mErr('Excel projects need the messy Excel file. Add one above, or change the project type.');
  if(k==='code'&&!PM.length&&!PMT.code.trim())return mErr('Code projects need the messy code. Add a file or paste it above, or change the project type.');
  if(k==='refs'&&!PMT.refs.trim())return mErr('PowerPoint projects need at least one reference or website. Add one above, or change the project type.');
  const mats={files:k&&k!=='refs'?PM:[],code:k==='code'?PMT.code:'',refs:k==='refs'?PMT.refs:''},
  o={title:d.title.trim(),firm:d.firm.trim(),by:d.by,type:d.type,prog:d.prog,level:d.level,hrs:+d.hrs,deadline:d.deadline,skills:d.skills,desc:d.desc.trim(),mats,docs:PD},bak=JSON.stringify(S);
  if(id)Object.assign(proj(id),o);else S.projects.unshift({id:'p'+uid(),status:'open',...o});
  if(!save()){S=JSON.parse(bak);return mErr('Not enough browser storage for these files. Use smaller files.')}
  log((id?'Updated':'Posted')+' project “'+o.title+'”');save();closeM();render();toast(id?'Project updated.':'Project posted. Students can now find it.')},
 verify(d){const c=S.creds.find(x=>x.id.toLowerCase()===d.cid.trim().toLowerCase());
  $('#vr').innerHTML=c?`<div class="card cred"><span class="badge ok">Valid credential</span><h3 style="margin-top:8px">${esc(c.title)}</h3><p>Holder: ${esc(c.holder)} (${esc(c.prog)})<br>Issued by: ${esc(c.firm)} · ${esc(c.type)} · ${c.hrs} hrs · ${fd(c.issuedAt)}</p></div>`:'<div class="card"><span class="badge bad">Not found</span><p style="margin-top:8px">No credential matches that ID. Check the ID and try again.</p></div>'}
};
document.addEventListener('click',e=>{
 if(e.target.id==='ta'){tAct&&tAct();$('#toast').classList.remove('on');return}
 const t=e.target.closest('[data-act],[data-role],[data-tab]');if(!t)return;
 if(t.dataset.act)A[t.dataset.act]?.(t.dataset.id);else if(t.dataset.role)go(t.dataset.role);else{tab=t.dataset.tab;render();window.scrollTo(0,0)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,x=new FormData(f),d=Object.fromEntries(x);d.skills=x.getAll('skills');F[f.dataset.form]?.(d,f.dataset.id,e.submitter&&e.submitter.value)});
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{const t=e.target;
 if(t.dataset.q&&t.id){Q[t.dataset.q]=t.value;$('#res').innerHTML=res()}
 if(ev==='change'&&t.matches('[data-files]'))addFiles(t);
 if(ev==='change'&&t.matches('[data-pmfiles]'))addPM(t);
 if(ev==='change'&&t.matches('[data-pdfiles]'))addPD(t);
 if(ev==='input'&&t.dataset.pm)PMT[t.dataset.pm]=t.value;
 if(ev==='change'&&t.id==='ty'){PM=[];$('#mats').innerHTML=matsForm(t.value)}
 if(ev==='change'&&t.matches('[data-import]')&&t.files[0]){const r=new FileReader();r.onload=()=>{try{S=migrate(JSON.parse(r.result));save();render();toast('Data imported.')}catch(x){toast('That file is not valid Skill1ssue data.')}};r.readAsText(t.files[0])}}));
function route(){const m=/^#verify=(.+)$/.exec(location.hash);if(m){vid=decodeURIComponent(m[1]);go('verify');return true}}
window.addEventListener('hashchange',route);
if(!route())render();
</script>
